<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Mitosis Lab: a Biology 30 game on mitosis, stem cells, cloning, cancer and teratogens.">
<style>[hidden]{display:none!important}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Mitosis Lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one narrow "bench" column. Home = vertical path of lab stations. Each station = Learn cards -> Lab demo(s) -> Practice questions.
   Microscope Bay = a stained-slide field with numbered pins. Accent = aceto-orcein magenta (the real stain used on root-tip slides). */
:root{
  --bg:#EDF2F1; --surface:#FFFFFF; --ink:#16282C; --muted:#53686D; --line:#CBD8D7; --line-dk:#B3C4C3;
  --stain:#B0246B; --stain-soft:#F6DCE9;
  --primary:#0F7B86; --primary-dk:#0A5B64; --on-primary:#FFFFFF;
  --teal:#0F6F7A; --teal-soft:#D6ECEE;
  --good:#1F8A5B; --good-soft:#D8F1E4; --on-good:#FFFFFF; --bad:#C23B3B; --bad-soft:#F9DCDC;
  --field:#F1E9F0; --wall:#B79BB6; --rim:#2A3A3E; --nucfill:rgba(255,255,255,.6);
  --floor:#E3EBEA; --floorline:#D0DCDA; --bench:#F7FAFA; --benchedge:#9FB3B2; --wall:#C9D6D5;
  --display:'Bricolage Grotesque',system-ui,sans-serif; --body:'Nunito',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1A1D; --surface:#16272B; --ink:#E6F0EF; --muted:#9DB3B6; --line:#2A4146; --line-dk:#1F3236;
  --stain:#EE6DAB; --stain-soft:#3A1A2B;
  --primary:#3DB5C2; --primary-dk:#23808B; --on-primary:#06191C;
  --teal:#5CC3CD; --teal-soft:#14343A;
  --good:#4CC38A; --good-soft:#143428; --on-good:#06191C; --bad:#F07373; --bad-soft:#3B1B1B;
  --field:#261B28; --wall:#6B536B; --rim:#050B0C; --nucfill:rgba(255,255,255,.07);  --floor:#12242A; --floorline:#1B3137; --bench:#223A40; --benchedge:#0B1719; --wall:#2C454B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1A1D; --surface:#16272B; --ink:#E6F0EF; --muted:#9DB3B6; --line:#2A4146; --line-dk:#1F3236;
  --stain:#EE6DAB; --stain-soft:#3A1A2B;
  --primary:#3DB5C2; --primary-dk:#23808B; --on-primary:#06191C;
  --teal:#5CC3CD; --teal-soft:#14343A;
  --good:#4CC38A; --good-soft:#143428; --on-good:#06191C; --bad:#F07373; --bad-soft:#3B1B1B;
  --field:#261B28; --wall:#6B536B; --rim:#050B0C; --nucfill:rgba(255,255,255,.07);  --floor:#12242A; --floorline:#1B3137; --bench:#223A40; --benchedge:#0B1719; --wall:#2C454B; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:640px;margin:0 auto;padding-block:20px 48px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:2rem;font-weight:800}
h2{font-size:1.35rem;font-weight:800}
h3{font-size:1.1rem;font-weight:800}
p{margin:0}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--stain);outline-offset:2px}
.muted{color:var(--muted)}
.tag{display:inline-block;font:800 12px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--stain);background:var(--stain-soft);border-radius:999px;padding:3px 10px}

.btn{display:block;width:100%;font:800 15px var(--body);letter-spacing:.05em;text-transform:uppercase;border:0;border-radius:14px;padding:14px 20px;
  background:var(--primary);color:var(--on-primary);box-shadow:0 4px 0 var(--primary-dk);cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--primary-dk)}
.btn[disabled]{background:var(--line);color:var(--muted);box-shadow:0 4px 0 var(--line-dk);cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--teal);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.sm{display:inline-block;width:auto;padding:9px 14px;font-size:13px}
.btn.on{border-color:var(--teal);background:var(--teal-soft)}
.link{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font:700 14px var(--body)}

.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.pill{font:800 14px var(--body);background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:4px 12px;white-space:nowrap}
.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px}
.namebox{display:flex;flex-direction:column;gap:6px;margin-bottom:22px}
.namebox label{font:800 13px var(--body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
input[type=text],textarea,select{width:100%;font:600 16px var(--body);color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 12px}
select{font-size:15px;padding:9px}
textarea{min-height:110px;resize:vertical}
.path{display:flex;flex-direction:column;gap:6px;padding-block:4px}
.step{display:flex;align-items:center;gap:14px;margin-left:min(var(--off,0px),10vw)}
.step+.step{margin-top:12px}
.node{flex:none;width:68px;height:68px;border-radius:50%;border:0;font:800 24px var(--display);cursor:pointer;
  background:var(--primary);color:var(--on-primary);box-shadow:0 6px 0 var(--primary-dk)}
.node:active{transform:translateY(4px);box-shadow:0 2px 0 var(--primary-dk)}
.node.done{background:var(--good);color:var(--on-good);box-shadow:0 6px 0 rgba(0,0,0,.25)}
.node.lock{background:var(--line);color:var(--muted);box-shadow:0 6px 0 var(--line-dk);cursor:not-allowed}
.steptxt{display:flex;flex-direction:column;gap:2px;min-width:0}
.steptxt b{font:800 17px var(--display)}
.steptxt span{font-size:14px;color:var(--muted)}
details{margin-top:24px}
summary{cursor:pointer;font:800 14px var(--body);color:var(--teal)}
.map{margin:12px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.gloss{margin:12px 0 0;display:grid;gap:8px}
.gloss div{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-size:15px}
.gloss b{color:var(--stain)}

.bar{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.x{flex:none;background:none;border:0;font:800 26px var(--body);color:var(--muted);cursor:pointer;line-height:1;padding:4px 8px}
.prog{flex:1;height:14px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .3s}
.dots{flex:1;display:flex;gap:6px}
.dots i{flex:1;height:10px;border-radius:99px;background:var(--line)}
.dots i.on{background:var(--stain)}
.hearts{display:flex;gap:3px;align-items:center;color:var(--bad)}
.hearts svg{width:22px;height:22px}
.q{font-size:1.3rem;margin-bottom:16px}
.fig{max-width:320px;margin:0 auto 12px}
.figsvg{display:block;width:100%;height:auto}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;font:700 16px var(--body);color:var(--ink);background:var(--surface);
  border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:12px 14px;cursor:pointer}
.opt .k{flex:none;width:26px;height:26px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;font:800 13px var(--body);color:var(--muted)}
.opt.sel{border-color:var(--teal);background:var(--teal-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.line,.pool{display:flex;flex-wrap:wrap;gap:8px}
.line{min-height:58px;padding:10px;border:2px dashed var(--line);border-radius:14px;margin-bottom:14px;align-content:flex-start}
.chip{font:700 15px var(--body);background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:8px 12px;cursor:pointer;text-align:left}
.chip.right{border-color:var(--good);background:var(--good-soft)}
.chip.wrong{border-color:var(--bad);background:var(--bad-soft)}
.srow{display:flex;flex-direction:column;gap:8px;padding:12px;background:var(--surface);border:2px solid var(--line);border-radius:14px}
.srow.right{border-color:var(--good);background:var(--good-soft)}
.srow.wrong{border-color:var(--bad);background:var(--bad-soft)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:86px;font:800 13px var(--body);padding:8px;border-radius:10px;border:2px solid var(--line);background:var(--surface);cursor:pointer}
.seg button.on{border-color:var(--teal);background:var(--teal-soft);color:var(--teal)}
.stack{display:flex;flex-direction:column;gap:10px}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcols .col{display:flex;flex-direction:column;gap:10px;min-width:0}
.mbtn{font:700 14px var(--body);text-align:left;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:10px;cursor:pointer;min-height:64px}
.mbtn.sel{border-color:var(--teal);background:var(--teal-soft)}
.mbtn.ok{border-color:var(--good);background:var(--good-soft);opacity:.75;cursor:default}
.mbtn.no{border-color:var(--bad);background:var(--bad-soft)}
.foot{position:sticky;bottom:0;margin-top:22px;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg)}
.sheet{border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.sheet.good{background:var(--good-soft)} .sheet.bad{background:var(--bad-soft)}
.sheet strong{font:800 18px var(--display)}
.sheet.good strong{color:var(--good)} .sheet.bad strong{color:var(--bad)}
.sheet .why{font-size:15px}
.ovl{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;margin-bottom:16px}

.center{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;padding-top:8px}
.big{font:800 3rem var(--display);color:var(--stain)}
.facts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.note{text-align:left;width:100%}
.note dl{margin:10px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:15px}
.note dt{font:800 12px var(--body);letter-spacing:.05em;text-transform:uppercase;color:var(--stain);padding-top:3px}
.note dd{margin:0}
.brief{display:flex;flex-direction:column;gap:14px}
.plan{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:15px}
.plan li{display:flex;gap:10px;align-items:center}
.plan i{flex:none;width:10px;height:10px;border-radius:50%;background:var(--stain)}

.term{display:flex;flex-direction:column;gap:2px;background:var(--stain-soft);border-radius:14px;padding:10px 14px}
.term b{color:var(--stain);font:800 17px var(--display)}
.term span{font-size:15px}
.vis{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px}
.vis svg{display:block;width:100%;height:auto}
.mission{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.mission li{display:flex;gap:10px;align-items:center;font-weight:700;font-size:15px}
.mission .ck{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px}
.mission li.on .ck{background:var(--good);border-color:var(--good);color:var(--on-good)}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.cnt{font:800 22px var(--display)}
.sqs{display:flex;gap:4px;flex-wrap:wrap}
.sqs i{width:22px;height:22px;border-radius:5px;background:var(--line)}
.sqs i.on{background:var(--teal)}
.rate{display:flex;gap:3px}
.rate i{width:26px;height:10px;border-radius:3px;background:var(--line)}
.rate i.on{background:var(--good)}
.rate.bad i.on{background:var(--bad)}
.trow{display:flex;flex-direction:column;gap:6px;padding:10px 12px;background:var(--surface);border:2px solid var(--line);border-radius:12px}
.trow.pass{border-color:var(--good);background:var(--good-soft)}
.trow.fail{border-color:var(--bad);background:var(--bad-soft)}
.trow label{font:800 15px var(--body)}

.scopebox{position:relative;border:6px solid var(--rim);border-radius:18px;overflow:hidden;background:var(--field)}
.scopebox::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.35))}
.field{display:block;width:100%;height:auto}
.wall{fill:none;stroke:var(--wall);stroke-width:2}
.blob{fill:var(--stain)}
.pin{fill:var(--surface);stroke:var(--stain);stroke-width:2}
.pin.ok{fill:var(--good);stroke:var(--good)}
.pn{font:800 13px var(--body);fill:var(--ink);text-anchor:middle;pointer-events:none}
.pn.ok{fill:var(--on-good)}
.selc{fill:none;stroke:var(--teal);stroke-width:4}
.hit{fill:transparent;cursor:pointer}
.cell{fill:var(--teal-soft);stroke:var(--teal);stroke-width:2}
.nuc{fill:var(--nucfill);stroke:var(--stain);stroke-width:2}
.nucl{fill:var(--stain);opacity:.5}
.chr{fill:none;stroke:var(--stain);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.chn{fill:none;stroke:var(--stain);stroke-width:1.5;opacity:.8}
.sp{stroke:var(--muted);stroke-width:1;opacity:.7}
.pole{fill:var(--muted)}
.plate{stroke:var(--teal);stroke-width:2;stroke-dasharray:4 3}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tools .grp{display:flex;gap:6px}
.tools button{font:800 13px var(--body);padding:7px 12px;border-radius:10px;border:2px solid var(--line);background:var(--surface);cursor:pointer}
.tools button.on{border-color:var(--teal);background:var(--teal-soft);color:var(--teal)}
.phbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.tally{width:100%;border-collapse:collapse;font-size:15px}
.tally td,.tally th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.tally td:last-child,.tally th:last-child{text-align:right;font-variant-numeric:tabular-nums}
.fb{padding:10px 12px;border-radius:12px;font-size:15px}
.fb.good{background:var(--good-soft)} .fb.bad{background:var(--bad-soft)} .fb.info{background:var(--teal-soft)}

.c-h{fill:var(--teal-soft);stroke:var(--teal);stroke-width:1.5}
.c-f{fill:var(--teal-soft);stroke:var(--teal);stroke-width:2;stroke-dasharray:3 2}
.c-t{fill:var(--stain-soft);stroke:var(--stain);stroke-width:1.5}
.c-d{fill:var(--line);stroke:var(--muted);stroke-width:1.5}
.dot-h{fill:var(--teal)} .dot-d{fill:var(--stain)} .dot-e{fill:var(--line)}
.dish{fill:var(--field);stroke:var(--rim);stroke-width:4}

.eyepiece{background:var(--field);border:6px solid var(--rim);border-radius:20px;padding:14px}
.gh{font:800 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--stain);margin:18px 0 -2px}
.dpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,48px);gap:6px;justify-content:center;margin-top:12px}
.dpad button{font:800 20px var(--body);border-radius:12px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);cursor:pointer}
.dpad button:active{transform:translateY(2px)}
.mapbox{border:6px solid var(--rim);border-radius:18px;overflow:hidden;background:var(--surface)}
.mapbox svg{display:block;width:100%;height:auto}
.floor{fill:var(--surface);stroke:var(--line);stroke-width:.6;cursor:pointer}
.tbl{fill:var(--line-dk);stroke:var(--rim);stroke-width:2}
.mt{stroke-width:1.5}
.mt.done{fill:var(--good-soft);stroke:var(--good)}
.mt.open{fill:var(--stain-soft);stroke:var(--stain)}
.mt.lock{fill:var(--line);stroke:var(--line-dk)}
.ico{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.mnum{font:800 9px var(--body);fill:var(--ink);text-anchor:middle;pointer-events:none}
.hud{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.hud .cellfig{flex:none;width:92px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:4px}
.phases{display:flex;gap:4px;margin-top:6px}
.phases i{flex:1;height:8px;border-radius:99px;background:var(--line)}
.phases i.on{background:var(--stain)}
.pt.yes{background:var(--good-soft);border-color:var(--good);color:var(--ink);box-shadow:0 4px 0 var(--good)}
.pt.no{background:var(--bad-soft);border-color:var(--bad);color:var(--ink);box-shadow:0 4px 0 var(--bad)}
.key{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin:0 4px 0 8px}
.eyecv{display:block;width:100%;height:auto;touch-action:none;cursor:grab;border-radius:12px;background:#0b0d0e}
.focus{width:100%;accent-color:var(--primary)}
.micro{display:block;width:100%;height:auto;border-radius:10px;border:2px solid var(--line)}
.rfoot{margin-top:20px}
.wrap.wide{max-width:1180px}
.labgrid{display:grid;gap:16px;align-items:start}
@media (min-width:900px){.labgrid{grid-template-columns:minmax(0,1fr) 300px}.side{position:sticky;top:12px}}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.mapscroll{overflow-x:auto;border-radius:20px}
.labmap{display:block;width:100%;min-width:660px;height:auto}
.fhit{fill:transparent;cursor:pointer}
.cub{cursor:pointer}
.cub:hover .sign,.cub:focus-visible .sign{filter:brightness(1.08)}
.cub:focus-visible{outline:none}
.cub:focus-visible .cubfloor{stroke:var(--stain);stroke-width:4}
.signtxt{font:800 15px var(--body);fill:#fff}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.rep{display:flex;flex-direction:column;gap:6px}
.rep label{font:800 15px var(--body)}
#out{min-height:200px;font:600 13px/1.5 ui-monospace,Menlo,monospace}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}.prog i{transition:none}}
</style>

<body>
<div class="wrap" id="app"></div>

<script defer src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.2/dist/pixi.min.js"></script>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let S={name:'',xp:0,done:{},rep:{},open:false,scope:null,pos:{x:2,y:3}};
try{const r=localStorage.getItem('cdl-v1');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem('cdl-v1',JSON.stringify(S))}catch(e){}};

/* ---------- cell drawings (shared by quiz figures and the microscope) ---------- */
function parts(p,bare){
  const X=(x,y,r)=>`<path class="chr" transform="translate(${x} ${y}) rotate(${r})" d="M-6,-9L6,9M6,-9L-6,9"/>`;
  const V=(x,y,r)=>`<path class="chr" transform="translate(${x} ${y}) rotate(${r})" d="M-5,-8L0,2L5,-8"/>`;
  const sq=(x,y)=>`<path class="chn" d="M${x-14},${y}q7,-9 14,0t14,0"/>`;
  const oc=d=>bare?'':d;
  if(p==='interphase')return oc(`<ellipse class="cell" cx="100" cy="70" rx="92" ry="58"/>`)+`<circle class="nuc" cx="100" cy="70" r="34"/><circle class="nucl" cx="110" cy="60" r="6"/>`+sq(100,54)+sq(100,70)+sq(100,86);
  if(p==='prophase')return oc(`<ellipse class="cell" cx="100" cy="70" rx="92" ry="58"/>`)+`<circle class="nuc" cx="100" cy="70" r="36" stroke-dasharray="5 4"/>`+X(88,58,20)+X(112,56,-25)+X(90,84,50)+X(113,82,-10);

   <br><span class="muted">Clues: after 10 divisions there are about 1,000 cells. After 20 there are about 1,000,000.</span></div>`;
  if(!m.ok){
   return s+(m.msg?`<div class="fb bad">${esc(m.msg)}</div>`:'')+`<div class="facts"><button class="btn ghost sm" data-a="rg" data-v="-1" ${m.g<=5?'disabled':''} aria-label="One fewer division">−</button><span class="pill cnt" style="font-size:18px">${m.g} divisions</span><button class="btn ghost sm" data-a="rg" data-v="1" ${m.g>=40?'disabled':''} aria-label="One more division">+</button></div><button class="btn" data-a="rr">Run it</button>`;
  }
  let o=`<div class="fb good"><b>30 divisions.</b> 2 to the power of 30 is about 1.07 billion. The first divisions make so few cells that a tumour can grow unnoticed. (Real tumours divide more slowly than once a day.)</div>`;
  o+=`<h3>Which gene normally applies the brakes and triggers apoptosis?</h3><div class="stack">${[['sup','Tumour suppressor gene'],['onc','Oncogene'],['tel','Telomerase']].map(([k,l])=>`<button class="opt ${m.a2===k?(k==='sup'?'right':'wrong'):''}" data-a="r2" data-k="${k}" ${m.a2==='sup'?'disabled':''}>${l}</button>`).join('')}</div>`;
  if(m.a2==='sup'){
   o+=`<div class="fb good">Correct. When a tumour suppressor gene is mutated, damaged cells can keep dividing instead of destroying themselves.</div><h3>Some tumour cells break away, travel in the blood and start new tumours elsewhere. What is this called?</h3><div class="stack">${[['meta','Metastasis'],['apo','Apoptosis'],['dif','Differentiation']].map(([k,l])=>`<button class="opt ${m.a3===k?(k==='meta'?'right':'wrong'):''}" data-a="r3" data-k="${k}" ${m.a3==='meta'?'disabled':''}>${l}</button>`).join('')}</div>`;
   if(m.a3==='meta')o+=`<div class="fb good"><b>Metastasis</b> is why cancer that has spread is harder to treat.</div>`;
  }
  return s+o+guide;
 },
 act(m,a,d){
  if(a==='rg'){m.g=Math.max(5,Math.min(40,m.g+(+d.v)));m.msg=null}
  if(a==='rr'){if(m.g===30)m.ok=true;else{lose();m.msg=m.g<30?'Not enough cells for a tumour that size. Use the clues and try more divisions.':'That is far more than a billion cells. Try fewer divisions.'}}
  if(a==='r2'){m.a2=d.k;if(d.k!=='sup')lose()}
  if(a==='r3'){m.a3=d.k;if(d.k!=='meta')lose()}
 },
 mission:m=>[['Predict the number of divisions',m.ok],['Name the gene that failed',m.a2==='sup'],['Name the spread of cancer',m.a3==='meta']]},
meta:{title:'Watch a tumour spread',intro:'This is a time-lapse of living tissue. Watch the primary tumour, then follow the cells that break away. Read each stage as it appears.',
 init:()=>{metaStop();META.paused=false;return {seen:false,q1:null,q2:null}},
 view(m){
  const stg=META.stage||0;
  let s=`<div class="scopebox" id="pixihost" style="min-height:120px"></div>
   <div class="prog" style="margin-top:8px"><i id="metabar" style="width:${Math.min(100,100*(META.t||0)/31)}%"></i></div>
   <div class="fb info" id="metacap" aria-live="polite">${esc(MCAP[stg])}</div>
   <div class="row2"><button class="btn ghost sm" data-a="mp">${META.paused?'Play':'Pause'}</button><button class="btn ghost sm" data-a="mr">Replay from the start</button></div>`;
  if(!m.seen)return s+`<p class="muted" style="font-size:14px">The questions appear when the secondary tumour has formed.</p>`;
  const Q=(id,q,opts,ans,why)=>`<h3>${q}</h3><div class="stack">${opts.map(([k,l])=>`<button class="opt ${m[id]===k?(k===ans?'right':'wrong'):''}" data-a="${id}" data-k="${k}" ${m[id]===ans?'disabled':''}>${l}</button>`).join('')}</div>${m[id]===ans?`<div class="fb good">${why}</div>`:m[id]?`<div class="fb bad">Not quite. Replay the animation and watch where the cells go.</div>`:''}`;
  s+=Q('q1','1. How did the tumour cells reach the lung?',[['blood','They entered a blood vessel and were carried in the blood'],['grow','The primary tumour grew until it touched the lung'],['air','They were breathed in through the air']],'blood','Correct. Cancer cells can travel in blood vessels or in lymph vessels to reach other organs.');
  if(m.q1==='blood')s+=Q('q2','2. Why is cancer much harder to treat after it metastasizes?',[['many','There are now tumours in more than one place, so removing the first tumour is not enough'],['stop','Cells that travel stop dividing'],['lung','The secondary tumour is made of normal lung cells']],'many','Correct. The secondary tumour is made of the same cancer cells as the primary tumour, and there may be small tumours that are too tiny to see.');
  return s;
 },
 act(m,a,d){
  if(a==='mp')META.paused=!META.paused;
  if(a==='mr'){metaStop();META.paused=false}
  if(a==='q1'&&m.q1!=='blood'){m.q1=d.k;if(d.k!=='blood')lose()}
  if(a==='q2'&&m.q2!=='many'){m.q2=d.k;if(d.k!=='many')lose()}
 },
 mission:m=>[['Watch the tumour spread',m.seen],['How the cells travelled',m.q1==='blood'],['Why spread is dangerous',m.q2==='many']]},
clonelab:{title:'Clone a sheep',intro:'Three sheep, one lamb. Make the clone, predict what it will be like, then age it and see why clones can have shorter lives.',
 init:()=>({ord:shuffle([0,1,2,3,4,5]),seq:[],ofb:null,f:{},ffb:null,pred:null,age:0,q:null}),
 view(m){
  const sheepCards=`<div class="row2" style="font-size:14px"><div class="term"><b>Sheep A</b><span>Body cell donor. White face, curly wool. 6 years old.</span></div><div class="term"><b>Sheep B</b><span>Egg cell donor. Black face, straight wool.</span></div><div class="term"><b>Sheep C</b><span>Surrogate mother. Black face, straight wool.</span></div></div>`;
  const stepsDone=m.seq.length===6,featDone=CLF.every((_,i)=>m.f[i]===CLF[i][1]);
  let o=scntScene({step:featDone?7:m.seq.length,pred:0})+sheepCards;
  // part 1
  if(!stepsDone){
   o+=`<h3>Part 1: How is a clone made? Click the steps in order.</h3>
    <ol class="plan" style="list-style:decimal;padding-left:20px">${m.seq.map(i=>`<li>${esc(SC_STEPS[i][0])}</li>`).join('')}</ol>
    <div class="pool">${m.ord.filter(i=>!m.seq.includes(i)).map(i=>`<button class="chip" data-a="co" data-i="${i}">${esc(SC_STEPS[i][0])}</button>`).join('')}</div>
    ${m.ofb?`<div class="fb ${m.ofb.ok?'good':'bad'}">${esc(m.ofb.t)}</div>`:''}`;
   return o;
  }
  o+=`<div class="fb good"><b>Part 1 done.</b> This is somatic cell nuclear transfer (SCNT). After the electric pulse, the embryo grows by mitosis, so every cell carries Sheep A’s chromosomes.</div>`;
  // part 2
  o+=`<h3>Part 2: Which sheep does the lamb get each feature from?</h3><div class="stack">${CLF.map(([f,ans,why],i)=>{const ok=m.f[i]===ans;
    return `<div class="srow ${ok?'right':''}"><b>${esc(f)}</b><div class="seg">${['A','B','C'].map(k=>`<button class="${m.f[i]===k?'on':''}" data-a="cf" data-i="${i}" data-k="${k}" ${ok?'disabled':''}>Sheep ${k}</button>`).join('')}</div>${ok?`<span style="font-size:14px">${esc(why)}</span>`:''}</div>`}).join('')}</div>
   ${m.ffb?`<div class="fb bad">${esc(m.ffb)}</div>`:''}`;
  if(!featDone)return o;
  o+=`<div class="fb good"><b>The lamb is a clone of Sheep A:</b> white face, curly wool, the same chromosomes. Only its mitochondria came from B, and C just carried it.</div>`;
  // part 3
  o+=`<h3>Part 3: Age the sheep</h3><p>A normal lamb (made from an egg and a sperm) and the clone lamb are both born today. Each square is a piece of telomere. A cell stops dividing when its telomeres are down to 1 square.</p>`;
  if(m.pred!=='clone'){
   o+=`<p><b>Predict:</b> whose cells will reach their division limit first?</p><div class="stack">${[['clone','The clone lamb'],['normal','The normal lamb'],['same','Both at the same time']].map(([k,l])=>`<button class="opt ${m.pred===k?'wrong':''}" data-a="cp" data-k="${k}">${l}</button>`).join('')}</div>
    ${m.pred?`<div class="fb bad">Look at Part 2 again: how old were the chromosomes the clone received?</div>`:''}`;
   return o;
  }
  const nl=Math.max(1,12-m.age),cl=Math.max(1,6-m.age);
  const bar=(l,lab,stop)=>`<div class="stack" style="gap:4px"><b>${lab}</b><div class="sqs">${Array.from({length:12},(_,i)=>`<i class="${i<l?'on':''}" style="${stop&&i<l?'background:var(--bad)':''}"></i>`).join('')}</div></div>`;
  o+=`<div class="fb good">Good prediction. The clone’s chromosomes came from a 6-year-old sheep, so its telomeres were already shortened at birth.</div>
   <div class="facts"><span class="pill cnt" style="font-size:18px">Age: ${m.age} years</span></div>
   ${bar(nl,'Normal lamb',nl<=1)}${bar(cl,'Clone lamb',cl<=1)}
   ${m.age>=5?`<div class="fb bad"><b>Year ${Math.min(m.age,5)}:</b> the clone’s telomeres are used up. Its cells stop dividing, so tissues repair poorly and it shows signs of old age early.</div>`:''}
   ${m.age>=11?`<div class="fb info"><b>Year 11:</b> the normal sheep’s cells now reach their limit too. That is about a normal sheep lifespan (10 to 12 years).</div>`:''}
   ${m.age<11?`<button class="btn" data-a="ca">Age both sheep 1 year</button>`:''}`;
  if(m.age>=11){
   o+=`<div class="fb info"><b>Real example:</b> Dolly the sheep was cloned in 1996 from a cell taken from a 6-year-old ewe. Her telomeres were shorter than normal for her age, and she died at about 6½ with lung disease and arthritis. Scientists still debate how much telomeres were to blame, and some later clones have aged normally.</div>
    <h3>Why can a clone have a shorter life?</h3><div class="stack">${[['tel','Its cells started life with telomeres already shortened by the donor’s age'],['chr','Clones have fewer chromosomes than normal animals'],['mix','The surrogate mother’s DNA gets mixed into the clone']].map(([k,l])=>`<button class="opt ${m.q===k?(k==='tel'?'right':'wrong'):''}" data-a="cq" data-k="${k}" ${m.q==='tel'?'disabled':''}>${l}</button>`).join('')}</div>
    ${m.q==='tel'?`<div class="fb good">Correct. A clone’s cells can only divide so many more times before its telomeres run out.</div>`:m.q?`<div class="fb bad">Not quite. Look at the telomere bars.</div>`:''}`;
  }
  return o;
 },
 act(m,a,d){
  if(a==='co'){const i=+d.i;if(i===m.seq.length){m.seq.push(i);m.ofb={ok:true,t:SC_STEPS[i][1]}}else{lose();m.ofb={ok:false,t:'Not yet. Think about what has to happen first.'}}}
  if(a==='cf'){const i=+d.i;m.f[i]=d.k;if(d.k!==CLF[i][1]){lose();m.ffb=CLF[i][3]}else m.ffb=null}
  if(a==='cp'){m.pred=d.k;if(d.k!=='clone')lose()}
  if(a==='ca'&&m.age<11)m.age++;
  if(a==='cq'&&m.q!=='tel'){m.q=d.k;if(d.k!=='tel')lose()}
 },
 mission:m=>[['Put the cloning steps in order',m.seq.length===6],['Predict the clone’s features',CLF.every((_,i)=>m.f[i]===CLF[i][1])],['Age the sheep',m.age>=11],['Explain the shorter life',m.q==='tel']]},
nano:{title:'Which treatment is more precise?',intro:'This tissue has a tumour (magenta) in the middle. Dashed cells are healthy cells that also divide quickly, like hair follicle or gut lining cells. Run each treatment and compare.',
 init:()=>({run:null,res:{},q:null}),
 view(m){
  const dead=k=>{const r=m.run;if(!r)return false;if(r==='std')return k!=='h';return k==='t'};
  let g='';
  NANO.forEach((row,r)=>row.split('').forEach((k,c)=>{
    const d=dead(k),x=4+c*27,y=4+r*27,cls=d?'c-d':k==='h'?'c-h':k==='f'?'c-f':'c-t';
    g+=`<rect class="${cls}" x="${x}" y="${y}" width="23" height="23" rx="8"/>`;
    if(k==='t'&&!d)g+=`<circle cx="${x+11.5}" cy="${y+4}" r="2.5" fill="var(--stain)"/>`;
    if(d)g+=`<path d="M${x+7},${y+7}l9,9m0,-9l-9,9" stroke="var(--muted)" stroke-width="2" stroke-linecap="round"/>`;
  }));
  const both=m.res.std&&m.res.nano;
  return `<svg viewBox="0 0 220 140" style="max-width:320px;margin:0 auto;display:block" role="img" aria-label="Tissue grid with a tumour"><g>${g}</g></svg>
   <div class="row2"><button class="btn ghost sm" data-a="ns">Run standard chemotherapy</button><button class="btn ghost sm" data-a="nn">Run nanoparticle drug</button></div>
   ${m.run==='std'?`<div class="fb info"><b>Standard chemotherapy</b> attacks every cell that is dividing quickly. All tumour cells die, but so do healthy fast-dividing cells (hair loss, nausea).</div>`:''}
   ${m.run==='nano'?`<div class="fb info"><b>Nanoparticle drug.</b> Each nanoparticle carries the drug and a \u201ckey\u201d that fits the tumour cells, so only those cells take it up. Healthy cells are spared.</div>`:''}
   ${both?`<table class="tally"><tr><th>Treatment</th><th>Tumour cells killed</th><th>Healthy cells harmed</th></tr><tr><td>Standard chemotherapy</td><td>14</td><td>4</td></tr><tr><td>Nanoparticle drug</td><td>12</td><td>0</td></tr></table>
   <h3>Which treatment is more precise?</h3><div class="row2"><button class="btn ghost" data-a="nq" data-k="std" ${m.q==='nano'?'disabled':''}>Standard chemotherapy</button><button class="btn ghost" data-a="nq" data-k="nano" ${m.q==='nano'?'disabled':''}>Nanoparticle drug</button></div>
   ${m.q==='std'?'<div class="fb bad">Not that one. Which treatment harmed fewer healthy cells?</div>':''}
   ${m.q==='nano'?'<div class="fb good"><b>Correct.</b> Nanotechnology can target tumour cells and spare healthy ones. It is not perfect (two tumour cells could survive), and every new technology needs safety testing.</div>':''}`:''}`;
 },
 act(m,a,d){
  if(a==='ns'){m.run='std';m.res.std=1}
  if(a==='nn'){m.run='nano';m.res.nano=1}
  if(a==='nq'){m.q=d.k;if(d.k!=='nano')lose()}
 },
 mission:m=>[['Run standard chemotherapy',!!m.res.std],['Run the nanoparticle drug',!!m.res.nano],['Pick the more precise treatment',m.q==='nano']]},
scnt:{title:'Clone a sheep',intro:'You are the technician. Carry out each step in order, then predict what the lamb will look like.',
 init:()=>({step:0,pred:null,fb:null}),
 view(m){
  let ui;
  if(m.step<6)ui=`<div class="fb info">${m.step?esc(SC_STEPS[m.step-1][1]):'Sheep A has a white face. Sheep B and Sheep C have black faces.'}</div><button class="btn" data-a="ss">${esc(SC_STEPS[m.step][0])}</button>`;
  else if(m.step===6)ui=`<div class="fb info">${esc(SC_STEPS[5][1])}</div><h3>Predict: whose face will the lamb have?</h3>
    <div class="opts">${['Like Sheep A (white face)','Like Sheep B (black face)','Like Sheep C (black face)'].map((t,i)=>`<button class="opt" data-a="sp" data-i="${i}"><span class="k">${i+1}</span>${t}</button>`).join('')}</div>
    ${m.fb?`<div class="fb bad">${esc(m.fb)}</div>`:''}`;
  else ui=`<div class="fb good"><b>Correct: the lamb looks like Sheep A.</b> Its nuclear DNA came from Sheep A, so it is a clone of A. Sheep B only supplied the egg cytoplasm (including mitochondria) and Sheep C only carried the embryo.</div>
    <table class="tally"><tr><th>Sheep</th><th>What the lamb received</th></tr><tr><td>A</td><td>Nuclear DNA (all the chromosomes)</td></tr><tr><td>B</td><td>Egg cytoplasm and mitochondria</td></tr><tr><td>C</td><td>A womb to grow in</td></tr></table>`;
  return scntScene(m)+ui;
 },
 act(m,a,d){
  if(a==='ss'&&m.step<6)m.step++;
  if(a==='sp'){if(+d.i===0){m.pred=0;m.step=7;m.fb=null}else{lose();m.fb='Not quite. Think about whose nucleus is inside the embryo.'}}
 },
 mission:m=>[['Complete the six lab steps',m.step>=6],['Predict the lamb correctly',m.pred===0]]},
telomere:{title:'The telomere clock',intro:'Each square is a piece of telomere. A normal cell can divide only until its telomere is down to 2 squares. For each cell, predict first, then test.',
 init:()=>({pg:{young:null,old:null,cancer:null},tab:'young',t:{young:{len:10,divs:0},old:{len:5,divs:0},cancer:{len:10,divs:0}},hy:false,ho:false,big:false}),
 view(m){
  const tabs=[['young','Young body cell'],['old','Cell from an older donor'],['cancer','Cancer cell']];
  const P={young:['A young body cell starts with 10 squares and stops dividing at 2. How many times can it divide?',[[4,'4'],[6,'6'],[8,'8'],[10,'10']]],
   old:['A cell from an older donor starts with only 5 squares and also stops at 2. How many times can it divide?',[[2,'2'],[3,'3'],[5,'5'],[8,'8']]],
   cancer:['A cancer cell starts with 10 squares, but it has telomerase switched on. How many times can it divide?',[[8,'8'],[10,'10'],[20,'20'],[99,'No limit']]]};
  const T=`<div class="tools"><div class="grp" style="flex-wrap:wrap">${tabs.map(([k,l])=>`<button class="${m.tab===k?'on':''}" data-a="tt" data-k="${k}">${l}${(k==='young'&&m.hy)||(k==='old'&&m.ho)||(k==='cancer'&&m.big)?' \u2713':''}</button>`).join('')}</div></div>`;
  if(m.pg[m.tab]===null)return T+`<h3>Predict</h3><p>${P[m.tab][0]}</p><div class="row2">${P[m.tab][1].map(([n,l])=>`<button class="btn ghost" data-a="tp" data-n="${n}">${l}${n===99?'':' divisions'}</button>`).join('')}</div>`;
  const c=m.t[m.tab],stopped=m.tab!=='cancer'&&c.len<=2,pl=x=>x===99?'no limit':x+' divisions';
  return T+`<p class="muted">${m.tab==='old'?'A cell from an older donor has already used up much of its telomere. This is what a clone made from an adult cell starts with.':m.tab==='cancer'?'This cancer cell has telomerase switched on, so its telomeres are rebuilt after each division.':'A normal body cell has no telomerase. Its telomeres shorten with every division.'}</p>
   <p class="muted" style="font-size:14px">Your prediction: <b>${pl(m.pg[m.tab])}</b></p>
   <div class="sqs" role="img" aria-label="Telomere length ${c.len} out of 10">${Array.from({length:10},(_,i)=>`<i class="${i<c.len?'on':''}"></i>`).join('')}</div>
   <div class="facts"><span class="pill">Telomere length ${c.len}/10</span><span class="pill">${c.divs} divisions</span></div>
   ${stopped?`<div class="fb ${m.pg[m.tab]===c.divs?'good':'bad'}"><b>Stopped after ${c.divs} divisions.</b> You predicted ${pl(m.pg[m.tab])}. The telomeres are too short, so this cell can no longer divide.</div>`:''}
   ${m.tab==='cancer'&&c.divs>=12?`<div class="fb ${m.pg.cancer===99?'good':'bad'}"><b>Still dividing after ${c.divs} divisions.</b> You predicted ${pl(m.pg.cancer)}. With telomerase on, cancer cells can keep dividing with no limit.</div>`:''}
   <div class="row2"><button class="btn" data-a="td" ${stopped?'disabled':''}>Divide</button><button class="btn ghost" data-a="tr">Reset this cell</button></div>`;
 },
 act(m,a,d){
  if(a==='tp'){m.pg[m.tab]=+d.n;return}
  if(a==='tt'){m.tab=d.k;return}
  const c=m.t[m.tab];
  if(a==='td'){
    if(m.tab==='cancer'){c.divs++;if(c.divs>=12)m.big=true}
    else if(c.len>2){c.len--;c.divs++;if(c.len<=2){if(m.tab==='young')m.hy=true;else m.ho=true}}
  }
  if(a==='tr'){c.len=m.tab==='old'?5:10;c.divs=0}
 },
 mission:m=>[['Predict and test the young cell',m.hy],['Predict and test the older donor\u2019s cell',m.ho],['Predict and test the cancer cell',m.big]]},
contain:{title:'Teratogen lab',intro:'First trace where four teratogens come from. Then choose the technology that removes each one.',
 init:()=>Object.assign(DEMOS.sources.init(),DEMOS.treat.init()),
 view(m){const all=SRC.every(r=>m.seen[r.k]);
  return `<h3>Part 1: Trace the sources</h3><p class="muted">Tap each source on the map.</p>`+DEMOS.sources.view(m)+(all?`<h3 style="margin-top:8px">Part 2: Clean it up</h3><p class="muted">Choose one technology for each contaminant, then test. You need one that removes most of each.</p>`+DEMOS.treat.view(m):`<p class="muted">Inspect all four sources to unlock Part 2.</p>`)},
 act(m,a,d){DEMOS.sources.act(m,a,d);DEMOS.treat.act(m,a,d)},
 mission:m=>[...DEMOS.sources.mission(m),...DEMOS.treat.mission(m)]},
sources:{title:'Trace the sources',intro:'A river runs past four possible sources of teratogens. Tap each one to find out what it releases and how people are exposed.',
 init:()=>({sel:null,seen:{}}),
 view(m){
  const ic={
   house:x=>`<path d="M${x-18},40l18,-16l18,16z" fill="var(--stain-soft)" stroke="var(--stain)" stroke-width="2"/><rect x="${x-14}" y="40" width="28" height="22" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/>`,
   farm:x=>`<rect x="${x-20}" y="26" width="40" height="36" fill="var(--good-soft)" stroke="var(--good)" stroke-width="2"/><path d="M${x-20},38h40M${x-20},50h40" stroke="var(--good)" stroke-width="2"/>`,
   plant:x=>`<rect x="${x-20}" y="38" width="40" height="24" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/><rect x="${x+6}" y="22" width="9" height="16" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/><circle cx="${x+12}" cy="16" r="6" fill="var(--line)"/>`,
   fact:x=>`<path d="M${x-20},62v-24l10,8v-8l10,8v-8l10,8v-8l10,8v24z" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/>`};
  let s=`<svg viewBox="0 0 330 150" role="group" aria-label="River with four possible sources of teratogens"><g font-family="Nunito,sans-serif" font-size="12" font-weight="700" fill="var(--ink)" text-anchor="middle">
   <path d="M0,128q41,-14 82,0t82,0t82,0t84,0" fill="none" stroke="var(--teal)" stroke-width="9" stroke-linecap="round" opacity=".6"/>`;
  SRC.forEach(r=>{s+=`<g>${ic[r.k](r.x)}${m.seen[r.k]?`<circle cx="${r.x+22}" cy="26" r="9" fill="var(--good)"/><text x="${r.x+22}" y="30" fill="var(--on-good)">✓</text>`:''}<text x="${r.x}" y="88">${r.n}</text><rect x="${r.x-38}" y="14" width="76" height="82" fill="transparent" ${m.sel===r.k?'stroke="var(--teal)" stroke-width="3" rx="8"':''} data-a="sr" data-k="${r.k}" tabindex="0" role="button" aria-label="${r.n}" style="cursor:pointer"/></g>`});

 'Interphase':'The long stage in which a cell grows and copies its DNA. No separate chromosomes are visible.',
 'Prophase':'Chromosomes condense and become visible. The nuclear membrane breaks down.',
 'Metaphase':'Chromosomes line up along the middle of the cell.',
 'Anaphase':'Sister chromatids are pulled apart to opposite ends of the cell.',
 'Telophase':'Two new nuclei form at the ends of the cell and the cytoplasm divides.',
 'Mitotic index':'The share of cells in a tissue that are dividing.',
 'Totipotent':'Can become any cell and can form a whole organism, such as a zygote. Toti = whole.',
 'Pluripotent':'Can become almost any body cell, but not a whole organism. Pluri = many.',
 'Multipotent':'Can become several related cell types, such as blood cells. Multi = several.',
 'Differentiated':'Specialized for one job and unable to become other cell types.',
 'Stem cell':'An unspecialized cell that divides to make more cells, some of which specialize.',

 'Clone':'An organism that is genetically identical to its source.',
 'SCNT':'Somatic cell nuclear transfer: moving a body cell nucleus into an egg cell that has had its own nucleus removed.',
 'Surrogate':'An animal that carries an embryo until birth.',
 'Telomere':'A protective cap at the end of a chromosome. It shortens with each cell division.',
 'Telomerase':'An enzyme that rebuilds telomeres. Cancer cells and stem cells use it.',
 'Tumour':'A mass of cells formed by uncontrolled cell division.',
 'Metastasis':'Spread of cancer cells from the first tumour to form new tumours elsewhere.',

 'Apoptosis':'Programmed cell death. A cell with damaged DNA normally destroys itself.',
 'Nanotechnology':'Technology that works with materials about 1 to 100 nanometres wide.',
 'Teratogen':'An agent that can cause abnormal development of an embryo or fetus.',
 'Bioaccumulation':'A substance building up in living things and becoming more concentrated up the food chain.',
 'Activated carbon':'Porous carbon that traps chemicals on its surface.',
 'Reverse osmosis':'Forcing water through a membrane that blocks dissolved substances.',
 'Bioremediation':'Using microbes to break down pollutants.',

const quadOf=c=>(c.col>=3?1:0)+(c.row>=2?2:0);

    panel=`<div class="card stack"><h2>Slide count</h2>
      <table class="tally"><tr><th>Phase</th><th>Cells</th></tr>${PHK.map(p=>`<tr><td>${PHN[p]}</td><td>${tl[p]}</td></tr>`).join('')}<tr><td><b>Mitotic index (dividing ÷ total)</b></td><td><b>${div}/${Z.cells.length} = ${mi}%</b></td></tr></table>
      <p class="muted" style="font-size:14px">This practice slide was edited to show every stage. In real healthy tissue, the share of dividing cells is much lower.</p>
      <b>Why are most cells in healthy tissue in interphase?</b>
      <div class="opts">${Z.order.map(i=>{const o=opts[i];const c=qa==null?'':(o[1]?'right':(qa===i?'wrong':''));return `<button class="opt ${c}" data-a="sq" data-i="${i}" ${qa!=null?'disabled':''}>${esc(o[0])}</button>`}).join('')}</div>
      ${qa!=null?`<div class="fb ${opts[qa][1]?'good':'bad'}">${opts[qa][1]?'Correct. ':'Not quite. '}Interphase (G1, S and G2) is the long stage in which the cell grows and copies its DNA. Mitosis is a short event by comparison.</div>`:''}
      <button class="btn" data-a="sfinish" ${qa==null?'disabled':''}>Finish station</button></div>`;
  }else if(Z.sel){
    panel=`<div class="card stack"><b>Cell ${Z.sel}: which phase is it in?</b><div class="phbtns">${PHK.map(p=>`<button class="btn ghost sm" data-a="sans" data-p="${p}">${PHN[p]}</button>`).join('')}</div>
      ${Z.fb?`<div class="fb ${Z.fb.ok?'good':'bad'}">${esc(Z.fb.t)}</div>`:''}</div>`;
  }else{
    panel=`<div class="card stack"><p>${nd?'Pick another numbered pin.':'Tap a numbered pin on the slide.'} <span class="muted">Zoom to 40× to see the chromosomes.</span></p>
      ${Z.fb?`<div class="fb ${Z.fb.ok?'good':'bad'}">${esc(Z.fb.t)}</div>`:''}</div>`;
  }
  const lv=leaving?`<div class="ovl"><b>Leave Microscope Bay?</b><p class="muted">Your identifications on this slide will be lost.</p>
    <div class="mcols"><button class="btn ghost" data-a="stay">Stay</button><button class="btn" data-a="home">Leave</button></div></div>`:'';
  return `<div class="bar"><button class="x" data-a="quit" aria-label="Leave station">×</button>
    <div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="10" aria-valuenow="${nd}"><i style="width:${nd*10}%"></i></div><span class="pill">${nd}/10</span></div>${lv}
    <h2 style="margin-bottom:4px">Onion root tip</h2><p class="muted" style="margin-bottom:10px">Stained with aceto-orcein. DNA appears magenta.</p>
    <div class="tools"><div class="grp" role="group" aria-label="Magnification"><button class="${hi?'':'on'}" data-a="mag" data-m="low">10×</button><button class="${hi?'on':''}" data-a="mag" data-m="high">40×</button></div>
    ${hi?`<div class="grp" role="group" aria-label="Move the slide" style="flex-wrap:wrap">${quads.map((q,i)=>`<button class="${Z.quad===i?'on':''}" data-a="quad" data-q="${i}">${q}</button>`).join('')}</div>`:''}</div>
    <div class="scopebox">${field()}</div><div style="margin-top:14px">${panel}</div>`;
}
function scopeAnswer(p){
  const c=byPin(Z.sel),n=Z.sel;
  if(c.ph===p){
    const t=Z.tries[n]||0;Z.done[n]=true;
    if(t===0){Z.first++;S.xp+=10;Z.gain+=10}else{S.xp+=5;Z.gain+=5}
    save();Z.fb={ok:true,t:`Correct: ${PHN[p]}. ${HINT[p]}`};Z.sel=null;
    if(Object.keys(Z.done).length===10){Z.fin=true;Z.fb=null}
  }else{
    Z.tries[n]=(Z.tries[n]||0)+1;Z.err++;lose();
    Z.fb={ok:false,t:`Not ${PHN[p]}. Look again: ${HINT[c.ph]}`};
  }
}
function scopeFinish(){
  const pct=Math.round(100*Z.first/10);
  S.xp+=20;Z.gain+=20;record('scope',pct);
  const div=Z.cells.filter(c=>c.ph!=='interphase').length;
  S.scope={first:Z.first,total:10,mi:Math.round(100*div/Z.cells.length)};save();
  D={n:stById('scope'),pct,gain:Z.gain};view='done';
}

/* ---------- lab report ---------- */
function reportText(){
  const lines=['CELL DIVISION LAB: LAB REPORT','Name: '+(S.name||'(not entered)'),'XP: '+S.xp,'','Case results'];
  ST.filter(s=>!s.report).forEach(s=>lines.push('- '+s.n+': '+(S.done[s.id]?(S.done[s.id].pct!=null?S.done[s.id].pct+'% first try':'complete'):'not finished')));
  if(S.scope)lines.push('Microscope slide: '+S.scope.first+'/'+S.scope.total+' cells identified first try; mitotic index on slide '+S.scope.mi+'%');
  lines.push('','Written responses');
  PROMPTS.forEach(([k,p],i)=>lines.push('',(i+1)+'. '+p,(S.rep[k]||'(no answer)').trim()));
  return lines.join('\n');
}
function report(){
  return `<div class="bar"><button class="x" data-a="home" aria-label="Back to the lab">×</button></div>
  <span class="tag">Lab Report</span><h1 style="margin:6px 0 8px">Write it up</h1>
  <p class="muted" style="margin-bottom:16px">Answer each prompt in your own words. Your answers save as you type. When you are done, copy the report and paste it where your teacher asked.</p>
  <div class="namebox"><label for="nm">Your name or initials</label><input id="nm" type="text" value="${esc(S.name)}" autocomplete="off"></div>
  <div class="stack">${PROMPTS.map(([k,p],i)=>`<div class="rep"><label for="t${k}">${i+1}. ${esc(p)}</label><textarea id="t${k}" data-r="${k}">${esc(S.rep[k]||'')}</textarea></div>`).join('')}
  <button class="btn" data-a="copy">Copy my Lab Report</button><p id="msg" class="muted" role="status"></p>
  <textarea id="out" readonly hidden aria-label="Lab report text"></textarea>
  <button class="btn ghost" data-a="reset" id="rs">Reset my progress</button></div>`;
}
async function copyReport(){
  const t=reportText(),m=$('#msg');
  try{await navigator.clipboard.writeText(t);m.textContent='Copied. Paste it into your assignment.'}
  catch(e){const o=$('#out');o.hidden=false;o.value=t;o.focus();o.select();m.textContent='Select all the text below and copy it.'}
}

let RV=null;
function startReview(){RV={queue:shuffle(DQ).map(q=>({q,retry:false})),total:DQ.length,hearts:5,first:0,corr:0,gain:0};RB=rankIdx();rLoad();view='review';leaving=false}
function rLoad(){RV.sel=null;RV.inp='';RV.checked=false;RV.ok=false;const q=RV.queue[0].q;RV.ord=q.t==='mc'?shuffle(q.o.map((_,i)=>i)):[]}
function rCheck(){
  const it=RV.queue[0],q=it.q;
  if(q.t==='mc'&&RV.sel==null)return;
  if(q.t==='nr'&&!RV.inp.trim())return;
  const ok=q.t==='mc'?RV.sel===q.c:RV.inp.trim().replace(/^0+(?=\d)/,'')===q.nr;
  RV.checked=true;RV.ok=ok;
  if(ok){RV.corr++;if(!it.retry)RV.first++;const g=it.retry?5:10;S.xp+=g;RV.gain+=g;save()}
  else{RV.hearts--;RV.queue.push({q,retry:true})}
}
function rNext(){
  RV.queue.shift();
  if(RV.hearts<=0)return;
  if(!RV.queue.length){const pct=Math.round(100*RV.first/RV.total);S.xp+=20;RV.gain+=20;record('report',pct);D={n:stById('report'),pct,gain:RV.gain};view='done';return}
  rLoad();
}
function reviewView(){
  const it=RV.queue[0],q=it.q,lk=RV.checked;
  const hearts=`<div class="hearts" aria-label="${RV.hearts} hearts left">${Array.from({length:5},(_,i)=>i<RV.hearts?HEART:HEART0).join('')}</div>`;
  let body=`<span class="tag">${it.retry?'Try again':'Exam question '+(RV.total-RV.queue.length+1>RV.total?RV.total:RV.corr+1)+' of '+RV.total}</span>`;
  if(q.info)body+=`<div class="card" style="margin-top:10px;background:var(--teal-soft);border-color:var(--teal)"><b style="font-size:14px">Use the following information to answer the next question.</b><div style="margin-top:6px">${q.info}</div>${q.img?`<img class="micro" style="margin-top:10px" src="${onionImg(q.img)}" alt="Photomicrograph of onion root tip cells${q.img.t.filter(t=>t[3]).length?' with labelled cells':''}">`:''}</div>`;
  if(q.fig)body+=`<div class="fig" style="margin-top:12px">${fig(q.fig)}</div>`;
  body+=`<h2 class="q" style="margin-top:12px">${esc(q.q)}</h2>`;
  if(q.t==='mc')body+='<div class="opts">'+RV.ord.map((i,pos)=>{const o=q.o[i],c=lk?(i===q.c?'right':(RV.sel===i?'wrong':'')):(RV.sel===i?'sel':'');
    return `<button class="opt ${c}" data-a="rpick" data-i="${i}" ${lk?'disabled':''}><span class="k">${'ABCD'[pos]}</span>${esc(o)}</button>`}).join('')+'</div>';
  else body+=`<div class="card stack"><label for="nrin"><b>Numerical response</b></label><input id="nrin" type="text" inputmode="numeric" maxlength="4" autocomplete="off" value="${esc(RV.inp)}" ${lk?'disabled':''} style="font:800 28px var(--display);letter-spacing:.3em;text-align:center;max-width:220px"></div>`;
  const foot=!lk?`<button class="btn" data-a="rcheck">Check</button>`
   :`<div class="sheet ${RV.ok?'good':'bad'}"><strong>${RV.ok?'Correct':'Not quite'}</strong>${!RV.ok?`<p class="why"><b>Answer:</b> ${q.t==='mc'?'ABCD'[RV.ord.indexOf(q.c)]+'. '+esc(q.o[q.c]):esc(q.nr)}</p>`:''}<p class="why">${esc(q.why)}</p><button class="btn" data-a="rnext">Continue</button></div>`;
  return `<div class="bar"><button class="x" data-a="home" aria-label="Leave the review">×</button>
   <div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${RV.total}" aria-valuenow="${RV.corr}"><i style="width:${100*RV.corr/RV.total}%"></i></div>${hearts}</div>${body}<div class="rfoot" id="rfoot">${foot}</div>`;
}

/* ---------- render + events ---------- */
function html(){
  if(view==='review')return RV.hearts<=0?failView():reviewView();
  if(view==='map')return mapView();
  if(view==='brief')return brief();
  if(view==='demo')return demoView();
  if(view==='scope')return scopeView();
  if(view==='done')return doneView();
  return home();
}
function draw(){
  const app=$('#app'),y=window.scrollY;
  app.className='wrap'+(view==='map'?' wide':'');
  app.innerHTML=html();
  afterDraw();
  if(view==='scope'||view==='demo'||view==='map')window.scrollTo(0,y);
}
function go(v){view=v;leaving=false;draw();window.scrollTo(0,0)}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const a=b.dataset.a,d=b.dataset;
  if(a==='start'){if(cur.report)startReview();else startFlow(cur);draw();window.scrollTo(0,0);return}
  if(a==='reset'){
    if(b.dataset.armed){S={name:'',xp:0,done:{},rep:{},open:S.open,scope:null,pos:{x:2,y:3}};save();go('home');return}
    b.dataset.armed='1';b.textContent='Tap again to erase all progress';return;
  }
  if(a==='rretry'){startReview();draw();window.scrollTo(0,0);return}
  if(view==='review'){
    if(a==='rpick'&&!RV.checked)RV.sel=+d.i;
    else if(a==='rcheck'){rCheck();draw();const f=document.getElementById('rfoot');if(f&&f.scrollIntoView)f.scrollIntoView({block:'end',behavior:'smooth'});return}
    else if(a==='rnext'){rNext();draw();window.scrollTo(0,0);return}
    draw();return;
  }
  if(a==='home'){Z=null;DM=null;go('map');return}
  if(a==='title'){go('home');return}
  if(a==='enter'){go('map');return}
  if(view==='map'){
    if(a==='wf'){walkTo(+d.x,+d.y);return}
    if(a==='wt'){const t=TILES.find(x=>x.id===d.id);if(S.pos.x===t.x&&S.pos.y===t.y){if(unlocked(t.id)){cur=stById(t.id);go('brief')}else draw()}else walkTo(t.x,t.y);return}
    if(a==='open'){cur=stById(d.id);go('brief');return}
  }
  if(a==='unlock'){S.open=!S.open;save();draw();return}
  if(a==='mode'){S.open=d.v==='free';save();draw();return}
  if(a==='quit'){leaving=true;draw();return}
  if(a==='stay'){leaving=false;draw();return}
  if(view==='demo'){
    if(a==='tsel')return;
    if(a==='dnext'){S.xp+=10;save();advance();draw();window.scrollTo(0,0);return}
    F.d.act(DM,a,d);draw();return;
  }
  if(view==='scope'){
    if(a==='mag'){Z.mag=d.m;if(Z.mag==='high'&&Z.sel)Z.quad=quadOf(byPin(Z.sel))}
    else if(a==='quad')Z.quad=+d.q;
    else if(a==='scell'){const n=+d.n;if(!Z.done[n]){Z.sel=n;Z.fb=null;Z.mag='high';Z.quad=quadOf(byPin(n))}}
    else if(a==='sans')scopeAnswer(d.p);
    else if(a==='sq'&&Z.qa==null)Z.qa=+d.i;
    else if(a==='sfinish'){scopeFinish();draw();window.scrollTo(0,0);return}
    draw();return;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(view==='demo'&&t.dataset&&t.dataset.a==='tsel'){DM.as[t.dataset.c]=t.value;DM.res=null;draw()}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='nrin'&&RV&&!RV.checked){e.preventDefault();rCheck();draw();const f=document.getElementById('rfoot');if(f&&f.scrollIntoView)f.scrollIntoView({block:'end'});return}
  if(e.key==='Enter'&&view==='review'&&RV&&RV.checked&&!/BUTTON/.test(e.target.tagName)){e.preventDefault();rNext();draw();window.scrollTo(0,0);return}
  if(e.key==='Enter'||e.key===' '){const t=e.target;if(t&&t.hasAttribute&&t.hasAttribute('data-a')&&/^(rect|g)$/.test(t.tagName.toLowerCase())){e.preventDefault();t.dispatchEvent(new MouseEvent('click',{bubbles:true}))}}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='nm'){S.name=t.value;save()}
  else if(t.id==='nrin'&&RV){RV.inp=t.value}
  else if(t.dataset&&t.dataset.r){S.rep[t.dataset.r]=t.value;save()}
});
draw();
</script>
